<!DOCTYPE html>
<html>
<head>
    <title>Fox Mod Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🦊 Fox Mod Portal</h1>
    <p>Tactical Assault VR Community Mod Hub</p>
</header>

<main>
    <h2>Available Mods</h2>

    <div id="mods">
        Loading mods...
    </div>
</main>

<footer>
    <p>Fox Mod Portal v0.1</p>
</footer>

<script>
fetch("mods.json")
.then(response => response.json())
.then(data => {

    const container = document.getElementById("mods");

    data.mods.forEach(mod => {

        container.innerHTML += `
        <div class="mod-card">

            <h3>${mod.name}</h3>

            <p>
            Type: ${mod.type}<br>
            Version: ${mod.version}<br>
            Creator: ${mod.author}
            </p>

            <a href="${mod.download}">
                Download
            </a>

        </div>
        `;

    });

});
</script>

</body>
</html>
