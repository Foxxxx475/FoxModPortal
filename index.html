<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Mod Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        🦊 Fox Mod Portal
    </div>

    <p>
        Tactical Assault VR Community Mod Hub
    </p>
</header>

<nav>
    <input 
        id="search"
        type="text"
        placeholder="Search mods..."
    >

    <select id="category">
        <option value="All">All Categories</option>
        <option value="Map">Maps</option>
        <option value="Enemy">Enemies</option>
        <option value="Weapon">Weapons</option>
    </select>
</nav>


<main>

<h2>Available Mods</h2>

<div id="mods">
    Loading mods...
</div>

</main>


<footer>
    <p>
        Fox Mod Portal v0.1
    </p>
</footer>


<script src="script.js"></script>

</body>
</html>
